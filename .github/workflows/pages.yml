name: Build and deploy Hexo site

on:
  push:
    branches: [main]
  workflow_dispatch:

# 只为把构建产物推到 gh-pages 分支；Pages 仍按「从分支发布 gh-pages」工作，
# 所以不需要去 Settings 里改成 GitHub Actions，也不会碰到 github-pages 环境的保护规则。
permissions:
  contents: write

concurrency:
  group: pages-build
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npx hexo generate

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          commit_message: "Site updated: ${{ github.event.head_commit.message }}"
          user_name: zzxm
          user_email: 1059621960@qq.com
          # 旧站点带的自定义域名 b.xugaoyi.com 不再使用，所以不传 cname
          enable_jekyll: false
